<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" width="720" height="880" role="img" aria-labelledby="dl-t dl-d">
  <title id="dl-t">The MaxManager look: one accent, two warnings, three typefaces</title>
  <desc id="dl-d">One accent colour that follows the user theme, two fixed warning colours, three typefaces with one job each, a small set of corner radii, and motion that stays between 90 and 360 milliseconds.</desc>
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B242C"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="dl-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151F27"/>
      <stop offset="1" stop-color="#0E1418"/>
    </linearGradient>
  </defs>
  <rect x="0.0" y="0.0" width="720.0" height="880.0" rx="22" fill="url(#dl)" stroke="#243340" stroke-width="1.5"/>
  <rect x="34.0" y="6.0" width="652.0" height="1.4" rx="0.7" fill="#E8F1F7" opacity="0.10"/>
  <circle cx="620.0" cy="70.0" r="140.0" fill="#5AA9FF" opacity="0.03">
    <animate attributeName="opacity" values="0.03;0.08;0.03" keyTimes="0;0.5;1" dur="12.0s" repeatCount="indefinite"/>
  </circle>
  <rect x="36.0" y="44.0" width="90" height="6" rx="3.0" fill="#5AA9FF">
    <animate attributeName="width" values="90;216;216;90" keyTimes="0;0.16;0.84;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#5AA9FF;#BBDCFF;#5AA9FF" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="36.0" y="96.0" font-size="34" fill="#E8F1F7" font-weight="800" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">The look</text>
  <text x="36.0" y="132.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">One accent. Two warnings. Nothing else shouts.</text>
  <text x="36.0" y="188.0" font-size="21" fill="#93A9B8" font-weight="600" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">COLOUR</text>
  <rect x="36" y="206" width="96" height="88" rx="14" fill="#5AA9FF"/>
  <text x="36.0" y="326.0" font-size="22" fill="#E8F1F7" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Accent</text>
  <text x="36.0" y="354.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">follows your theme</text>
  <rect x="260" y="206" width="96" height="88" rx="14" fill="#FFB86B"/>
  <text x="260.0" y="326.0" font-size="22" fill="#E8F1F7" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Caution</text>
  <text x="260.0" y="354.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">#FFB86B</text>
  <rect x="484" y="206" width="96" height="88" rx="14" fill="#FF9A90"/>
  <text x="484.0" y="326.0" font-size="22" fill="#E8F1F7" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Critical</text>
  <text x="484.0" y="354.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">#FF9A90</text>
  <text x="36.0" y="396.0" font-size="21" fill="#9BBACB" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Readable on dark and on light — only the accent moves.</text>
  <text x="36.0" y="452.0" font-size="21" fill="#93A9B8" font-weight="600" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">TYPE</text>
  <text x="36.0" y="492.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Space Grotesk</text>
  <text x="300.0" y="496.0" font-size="34" fill="#E8F1F7" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Page title</text>
  <text x="36.0" y="546.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Manrope</text>
  <text x="300.0" y="548.0" font-size="22" fill="#E8F1F7" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Supporting copy</text>
  <text x="36.0" y="600.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Mono, for live values</text>
  <text x="300.0" y="602.0" font-size="30" fill="#5AA9FF" font-weight="600" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">42.5 °C · 3.1 GHz</text>
  <text x="36.0" y="662.0" font-size="21" fill="#93A9B8" font-weight="600" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">SHAPE</text>
  <rect x="36" y="688" width="60" height="60" rx="12" fill="url(#dl-card)" stroke="#243340" stroke-width="1.5"/>
  <rect x="136" y="688" width="60" height="60" rx="14" fill="url(#dl-card)" stroke="#243340" stroke-width="1.5"/>
  <rect x="236" y="688" width="60" height="60" rx="18" fill="url(#dl-card)" stroke="#243340" stroke-width="1.5"/>
  <rect x="336" y="688" width="60" height="60" rx="22" fill="url(#dl-card)" stroke="#243340" stroke-width="1.5"/>
  <rect x="436" y="688" width="60" height="60" rx="28" fill="url(#dl-card)" stroke="#243340" stroke-width="1.5"/>
  <rect x="544" y="694" width="132" height="48" rx="24" fill="none" stroke="#5AA9FF" stroke-width="1.5"/>
  <text x="36.0" y="786.0" font-size="21" fill="#9BBACB" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Rows, cards and sheets each get their own corner.</text>
  <text x="36.0" y="828.0" font-size="21" fill="#93A9B8" font-weight="600" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">MOTION</text>
  <rect x="150" y="816" width="45" height="10" rx="5" fill="#5AA9FF" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.45;0.85" keyTimes="0;0.5;1" dur="4.5s" begin="0.00s" repeatCount="indefinite"/>
  </rect>
  <rect x="209" y="816" width="80" height="10" rx="5" fill="#5AA9FF" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.45;0.85" keyTimes="0;0.5;1" dur="4.5s" begin="0.25s" repeatCount="indefinite"/>
  </rect>
  <rect x="303" y="816" width="120" height="10" rx="5" fill="#5AA9FF" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.45;0.85" keyTimes="0;0.5;1" dur="4.5s" begin="0.50s" repeatCount="indefinite"/>
  </rect>
  <rect x="437" y="816" width="180" height="10" rx="5" fill="#5AA9FF" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.45;0.85" keyTimes="0;0.5;1" dur="4.5s" begin="0.75s" repeatCount="indefinite"/>
  </rect>
  <text x="36.0" y="858.0" font-size="21" fill="#9BBACB" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Short and quiet: 90 to 360 ms.</text>
</svg>
