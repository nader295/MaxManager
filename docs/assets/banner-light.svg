      <stop offset="0" stop-color="#1558C0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1558C0" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#1558C0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bn-wipe">
      <rect x="40" y="44" width="520" height="96">
        <animate attributeName="width" values="0;520" keyTimes="0;1" dur="1.3s" repeatCount="1" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
