<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="bt bd">
  <title id="bt">MaxManager — performance control that asks before it acts</title>
  <desc id="bd">MaxManager, adaptive chip-aware performance control for rooted Android, with Max AI and Max Atlas, in 84 languages, and with no telemetry. A shield with a tick turns in a slow orbit beside the name.</desc>
