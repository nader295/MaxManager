<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" width="720" height="484" role="img" aria-labelledby="plt pld">
  <title id="plt">Four rules the app keeps</title>
  <desc id="pld">Absent, not disabled; verified, not assumed; honest about unknowns; nothing runs unseen.</desc>
  <defs>
    <linearGradient id="pl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B242C"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="pl-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151F27"/>
      <stop offset="1" stop-color="#0E1418"/>
    </linearGradient>
  </defs>
  <rect x="0.0" y="0.0" width="720.0" height="484.0" rx="22" fill="url(#pl)" stroke="#243340" stroke-width="1.5"/>
  <rect x="34.0" y="6.0" width="652.0" height="1.4" rx="0.7" fill="#E8F1F7" opacity="0.10"/>
  <circle cx="630.0" cy="40.0" r="170.0" fill="#5AA9FF" opacity="0.03">
    <animate attributeName="opacity" values="0.03;0.08;0.03" keyTimes="0;0.5;1" dur="11.0s" repeatCount="indefinite"/>
  </circle>
  <rect x="12.0" y="14.0" width="342" height="222" rx="18" fill="url(#pl-card)" stroke="#243340" stroke-width="1.4"/>
  <g>
    <animate attributeName="opacity" values="1;0.22;1" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
    <rect x="38.0" y="49.0" width="48" height="26" rx="13" fill="none" stroke="#9BBACB" stroke-width="2.2" stroke-dasharray="5 4"/>
    <circle cx="51.0" cy="62.0" r="7.5" fill="#9BBACB" opacity="0.7"/>
  </g>
  <text x="38.0" y="130.0" font-size="25" fill="#E8F1F7" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Absent, not disabled</text>
  <text x="38.0" y="164.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">A control your kernel</text>
  <text x="38.0" y="191.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">does not expose is not</text>
  <text x="38.0" y="218.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">on the screen at all.</text>
  <rect x="366.0" y="14.0" width="342" height="222" rx="18" fill="url(#pl-card)" stroke="#243340" stroke-width="1.4"/>
  <circle cx="416.0" cy="62.0" r="22" fill="none" stroke="#9BBACB" stroke-width="2.2"/>
  <path d="M406.0 62.0 L413.0 70.0 L427.0 53.0" fill="none" stroke="#5AA9FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="38" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="38;0;0;38" keyTimes="0;0.14;0.86;1" dur="9.6s" begin="0.0s" repeatCount="indefinite"/>
  </path>
  <text x="392.0" y="130.0" font-size="25" fill="#E8F1F7" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Verified, not assumed</text>
  <text x="392.0" y="164.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Every write is read back.</text>
  <text x="392.0" y="191.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">A change that did not hold</text>
  <text x="392.0" y="218.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">is reported as a failure.</text>
  <rect x="12.0" y="248.0" width="342" height="222" rx="18" fill="url(#pl-card)" stroke="#243340" stroke-width="1.4"/>
  <rect x="38.0" y="278.0" width="48" height="36" rx="18" fill="#5AA9FF" opacity="0.10">
    <animate attributeName="opacity" values="0.07;0.2;0.07" keyTimes="0;0.5;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="38.0" y="278.0" width="48" height="36" rx="18" fill="none" stroke="#5AA9FF" stroke-width="1.8" opacity="0.7"/>
  <text x="62.0" y="305.0" font-size="26" fill="#5AA9FF" text-anchor="middle" font-weight="800" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">?</text>
  <text x="38.0" y="364.0" font-size="25" fill="#E8F1F7" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Honest about unknowns</text>
  <text x="38.0" y="398.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">When it does not know,</text>
  <text x="38.0" y="425.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">it says status_unknown —</text>
  <text x="38.0" y="452.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">never a plausible zero.</text>
  <rect x="366.0" y="248.0" width="342" height="222" rx="18" fill="url(#pl-card)" stroke="#243340" stroke-width="1.4"/>
  <rect x="401.0" y="293.0" width="30" height="24" rx="6" fill="#5AA9FF" fill-opacity="0.12" stroke="#9BBACB" stroke-width="2.2"/>
  <path d="M408.0 293.0 V286.0 Q408.0 275.0 416.0 275.0 Q424.0 275.0 424.0 286.0 V293.0" fill="none" stroke="#9BBACB" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="416.0" cy="305.0" r="3.2" fill="#5AA9FF">
    <animate attributeName="opacity" values="1;0.35;1" keyTimes="0;0.5;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="392.0" y="364.0" font-size="25" fill="#E8F1F7" font-weight="700" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Nothing runs unseen</text>
  <text x="392.0" y="398.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Engines stay off until you</text>
  <text x="392.0" y="425.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">enable them. Every write</text>
  <text x="392.0" y="452.0" font-size="21" fill="#93A9B8" font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">uses one audited path.</text>
</svg>
